name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # 兜底：清理逻辑偶发挂住时不要占着 runner 十几分钟
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 自检
        run: npm run check
      - name: 格式
        run: npm run format:check
      - name: 测试
        run: npm test
      - name: 包体积
        run: npm run pack:size
